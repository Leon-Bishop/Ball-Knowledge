name: Validate pull requests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check web app and leaderboard code
        run: npm test
      - name: Parse Worker module
        run: node --input-type=module --check < leaderboard-worker/src/index.js
      - name: Validate Wikimedia player-photo importer
        run: |
          python -m py_compile scripts/build_player_photo_db.py
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("player_photos", "scripts/build_player_photo_db.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.license_is_usable("CC BY-SA 4.0")
          assert module.license_is_usable("CC BY 3.0")
          assert not module.license_is_usable("CC BY-NC 4.0")
          assert not module.license_is_usable("CC BY-ND 4.0")
          assert module.commons_file_name("https://commons.wikimedia.org/wiki/Special:FilePath/Player.jpg") == "Player.jpg"
          PY
      - name: Validate current-squad roster parser and headshot license rules
        run: |
          python -m py_compile scripts/build_current_headshots.py scripts/headshot_quality.py scripts/verify_current_rosters.py
          python scripts/build_current_headshots.py --self-test
          python scripts/verify_current_rosters.py --self-test
      - name: Verify final-crop face detection rejects non-faces
        run: |
          python -m pip install --disable-pip-version-check "numpy>=2,<3" "opencv-python-headless>=4.10,<5"
          python scripts/headshot_quality.py --self-test
