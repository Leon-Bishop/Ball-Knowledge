name: Build licensed footballer photo database
on:
  workflow_dispatch:
  # Historical photo collector retained for manual archival use only.
  # The live game uses current-headshots.yml and never uses this collection.
  push:
    paths:
      - "scripts/build_player_photo_db.py"
      - "photo-db/club-wikidata-map.json"
      - ".github/workflows/player-photo-db.yml"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: player-photo-import-incremental
  # Isolate checkpointed batches from the original long-running importer.
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect, validate and checkpoint player photos in short batches
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          git config user.name "ball-knowledge-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for batch in $(seq 1 19); do
            echo "Photo collection batch $batch (run start $STARTED_AT)"
            python -u scripts/build_player_photo_db.py --max-clubs 12 --since "$STARTED_AT" | tee /tmp/photo-import-result.txt
            python - <<'PY'
          import json
          t = json.load(open("teams.enriched.json"))
          d = json.load(open("assets/player-photo-db.json"))
          a = json.load(open("assets/player-photo-audit.json"))
          ids = {x["id"] for x in t}
          assert len(ids) == 214, f"Expected 214 clubs, got {len(ids)}"
          assert set(d["clubs"]).issubset(ids)
          assert a["totalClubs"] == len(ids)
          for club_id, record in d["clubs"].items():
              players = record["players"]
              assert len({p["wikidataQid"] for p in players}) == len(players)
              for p in players:
                  assert p["clubId"] == club_id
                  assert p["clubWikidataQid"] == record["clubWikidataQid"]
                  assert all(p.get(k) for k in ["photoUrl","sourceUrl","license","author","membershipSource"])
          covered7 = sum(len(v["players"]) >= 7 for v in d["clubs"].values())
          covered10 = sum(len(v["players"]) >= 10 for v in d["clubs"].values())
          assert a["completeClubs7"] == covered7
          assert a["completeClubs10"] == covered10
          print(f"Validated {covered7}/214 clubs (7+), {covered10}/214 (10+)")
          PY
            git add photo-db/club-wikidata-map.json assets/player-photo-db.json assets/player-photo-audit.json
            if ! git diff --cached --quiet; then
              git commit -m "Import verified football player photo batch $batch"
              pushed=0
              for attempt in 1 2 3 4 5; do
                git fetch origin main
                git rebase origin/main
                if git push origin HEAD:main; then
                  pushed=1
                  break
                fi
                sleep $((3 * attempt))
              done
              if [ "$pushed" -ne 1 ]; then
                echo "Could not checkpoint verified photo batch $batch"
                exit 1
              fi
            fi
            if grep -q '"attempted": 0' /tmp/photo-import-result.txt; then
              echo "All incomplete clubs attempted this run"
              break
            fi
          done

  deploy:
    # Deploy any successfully checkpointed photo batches even if a later
    # Wikimedia request exhausts the import job's time budget.
    if: ${{ always() && needs.import.result != 'cancelled' }}
    # Action-created commits don't trigger other push workflows.
    # Publish the updated verified photo database as part of this workflow.
    needs: import
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Publish new licensed photo data
        id: deployment
        uses: actions/deploy-pages@v5
