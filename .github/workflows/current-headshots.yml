name: Curate current-squad face-only player photos
on:
  workflow_dispatch:
  schedule:
    # Recheck squads weekly; football transfers and roster changes matter.
    - cron: "27 3 * * 0"
  push:
    branches: [main]
    paths:
      - "scripts/build_current_headshots.py"
      - ".github/workflows/current-headshots.yml"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ball-knowledge-photo-data
  # Importer checkpoints each batch; superseded runs should not continue
  # from stale database snapshots and race against a newer run.
  cancel-in-progress: false
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled and queued jobs must start from the latest committed
          # photo database, not the older workflow-triggering commit.
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install face detection and crop dependencies
        run: python -m pip install --disable-pip-version-check "pillow>=11,<13" "numpy>=2,<3" "opencv-python-headless>=4.10,<5"
      - name: Verify roster parser and photo license safeguards
        run: python scripts/build_current_headshots.py --self-test
      - name: Verify and crop headshots in checkpointed batches
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          git config user.name "ball-knowledge-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Fail closed immediately: remove bad existing crops before the
          # slower multi-league photo refresh begins.
          python scripts/headshot_quality.py --apply
          git add assets/player-headshot-db.json assets/player-headshot-face-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Revalidate published portraits for visible faces and eyes"
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for batch in $(seq 1 11); do
            echo "Curating headshots: batch $batch"
            # Use the first five checkpoints to fill missing trophy clues
            # before enriching already-covered clubs. Then resume broad curation.
            if [ "$batch" -le 5 ]; then
              echo "Prioritizing missing 🏆 player portraits"
              python -u scripts/build_current_headshots.py --only-missing-cups --max-clubs 20 --since "$STARTED_AT" | tee /tmp/headshots-batch.log
            else
              python -u scripts/build_current_headshots.py --max-clubs 20 --since "$STARTED_AT" | tee /tmp/headshots-batch.log
            fi
            git add assets/player-headshot-db.json assets/player-headshot-audit.json assets/player-headshots/
            if ! git diff --cached --quiet; then
              git commit -m "Import verified current-squad face crops, batch $batch"
              pushed=0
              for attempt in 1 2 3 4; do
                git fetch origin main
                git rebase origin/main
                if git push origin HEAD:main; then
                  pushed=1
                  break
                fi
                sleep $((attempt * 3))
              done
              if [ "$pushed" -ne 1 ]; then
                echo "Unable to checkpoint licensed headshots"
                exit 1
              fi
            fi
            if grep -q '"attempted": 0' /tmp/headshots-batch.log; then
              if [ "$batch" -le 5 ]; then
                echo "Trophy-first pass exhausted; continuing other clubs next"
              else
                echo "All clubs checked in this run"
                break
              fi
            fi
          done
      - name: Recheck every refreshed player against current club evidence
        run: |
          python -u scripts/verify_current_rosters.py --self-test
          python -u scripts/verify_current_rosters.py --apply --recheck-wikipedia
          git add assets/player-headshot-db.json assets/player-headshot-membership-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Validate refreshed headshots against current playing clubs"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Audit final JPEGs and remove face-less or off-center clues
        run: |
          python scripts/headshot_quality.py --self-test
          python scripts/headshot_quality.py --apply
          python scripts/headshot_quality.py --check-all
          git add assets/player-headshot-db.json assets/player-headshot-face-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Reject headshots without full visible centered faces"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
  deploy:
    if: ${{ always() && needs.curate.result != 'cancelled' }}
    needs: curate
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Publish verified headshots
        id: deployment
        uses: actions/deploy-pages@v5
