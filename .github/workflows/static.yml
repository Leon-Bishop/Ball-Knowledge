# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    # Türkiye uses UTC+3 year-round. Match-end-oriented local times:
    # 00:20 late matches, 06:20 Brazil/overnight, 16:15 early kickoff,
    # 18:45 afternoon kickoff, 22:20 prime-time kickoff.
    # Each scheduled refresh builds one shared cache for all visitors.
    - cron: "20 0 * * *"
      timezone: "Europe/Istanbul"
    - cron: "20 6 * * *"
      timezone: "Europe/Istanbul"
    - cron: "15 16 * * *"
      timezone: "Europe/Istanbul"
    - cron: "45 18 * * *"
      timezone: "Europe/Istanbul"
    - cron: "20 22 * * *"
      timezone: "Europe/Istanbul"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update live standings (optional)
        env:
          API_NINJAS_KEY: ${{ secrets.API_NINJAS_KEY }}
        run: node scripts/update-standings.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
